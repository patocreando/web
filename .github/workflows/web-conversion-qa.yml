name: Web Conversion QA

on:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "hero-v3.css"
      - "experience.css"
      - "*.js"
      - "*.css"
      - "scripts/**"
      - ".github/workflows/web-conversion-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Commercial copy and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify web scripts syntax
        run: |
          node --check script.js
          node --check capabilities.js
          node --check kinetic.js
          node --check film.js
          node --check scripts/browser-web.cjs
      - name: Validate site invariants
        run: node scripts/smoke-web.mjs

  browser:
    name: Real browser mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium chrome
      - name: Inspect responsive navigation, hero and CTAs
        run: |
          node scripts/browser-web.cjs
          node scripts/browser-cro-v2.cjs
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-conversion-qa-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
