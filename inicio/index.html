<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070909" />
  <title>Pato Creando — Elegí tu camino</title>
  <meta name="description" content="Contenido con IA y diseño web para marcas y negocios." />
  <style>
    :root{
      --bg:#060808;
      --bg2:#0a0d0c;
      --text:#f3f6f2;
      --muted:#9aa39d;
      --green:#b8eb6d;
      --line:rgba(184,235,109,.18);
      --glass:rgba(10,14,12,.58);
      --mx:50%;
      --my:50%;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    a{color:inherit;text-decoration:none}
    .page{
      position:relative;
      width:100%;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(900px 650px at var(--mx) var(--my),rgba(184,235,109,.095),transparent 58%),
        radial-gradient(520px 420px at 10% 15%,rgba(184,235,109,.055),transparent 70%),
        linear-gradient(135deg,#060808 0%,#090c0b 48%,#050707 100%);
    }
    .noise{
      position:absolute;inset:0;z-index:-1;opacity:.18;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode:soft-light;
    }
    .orb{
      position:absolute;width:42vw;aspect-ratio:1;border-radius:50%;
      left:50%;top:50%;transform:translate(-50%,-50%);
      border:1px solid rgba(184,235,109,.13);
      box-shadow:
        0 0 90px rgba(184,235,109,.055),
        inset 0 0 80px rgba(184,235,109,.025);
      z-index:-1;pointer-events:none;
      transition:transform .18s ease-out;
    }
    .orb:before,.orb:after{
      content:"";position:absolute;border-radius:inherit;inset:12%;
      border:1px solid rgba(184,235,109,.09)
    }
    .orb:after{inset:28%;border-color:rgba(184,235,109,.16)}
    .shell{
      width:min(1180px,calc(100% - 40px));
      display:grid;
      gap:42px;
      align-items:center;
      padding:28px 0;
    }
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:16px
    }
    .brand{
      font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#dfe7df
    }
    .tag{
      font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)
    }
    .hero{
      display:grid;gap:28px
    }
    h1{
      margin:0;
      font-size:clamp(48px,7.2vw,102px);
      line-height:.92;
      letter-spacing:-.06em;
      max-width:860px;
      font-weight:650;
    }
    .accent{color:var(--green)}
    .choices{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      perspective:1200px;
    }
    .choice{
      position:relative;
      min-height:250px;
      padding:26px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.09);
      border-radius:26px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012)),
        var(--glass);
      backdrop-filter:blur(18px);
      box-shadow:0 24px 80px rgba(0,0,0,.28);
      transition:transform .32s cubic-bezier(.2,.7,.2,1),border-color .25s ease,background .25s ease,box-shadow .25s ease;
      will-change:transform;
    }
    .choice:before{
      content:"";position:absolute;inset:auto -20% -58% -20%;height:68%;
      background:radial-gradient(circle,rgba(184,235,109,.17),transparent 62%);
      opacity:.35;transition:opacity .25s ease,transform .35s ease;
    }
    .choice:after{
      content:"↗";
      position:absolute;right:24px;top:22px;
      font-size:24px;color:rgba(255,255,255,.46);
      transition:transform .3s ease,color .2s ease;
    }
    .choice:hover{
      transform:translateY(-7px) scale(1.012);
      border-color:rgba(184,235,109,.36);
      background:linear-gradient(180deg,rgba(184,235,109,.06),rgba(255,255,255,.014)),var(--glass);
      box-shadow:0 30px 110px rgba(0,0,0,.42),0 0 0 1px rgba(184,235,109,.035);
    }
    .choice:hover:before{opacity:.75;transform:translateY(-8%)}
    .choice:hover:after{transform:translate(3px,-3px);color:var(--green)}
    .eyebrow{
      position:relative;z-index:1;
      font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--green)
    }
    .choice h2{
      position:relative;z-index:1;
      margin:0 0 9px;
      font-size:clamp(30px,3.4vw,48px);
      line-height:1;
      letter-spacing:-.045em;
      font-weight:620;
    }
    .choice p{
      position:relative;z-index:1;
      margin:0;color:var(--muted);
      font-size:13px;letter-spacing:.02em
    }
    .foot{
      display:flex;justify-content:space-between;align-items:center;gap:18px;
      color:#7f8882;font-size:11px;letter-spacing:.08em;text-transform:uppercase
    }
    .dot{display:inline-flex;align-items:center;gap:8px}
    .dot:before{
      content:"";width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 14px rgba(184,235,109,.58)
    }
    @media (max-width:760px){
      body{overflow:auto}
      .page{min-height:100svh;align-items:stretch}
      .shell{width:min(100% - 24px,680px);padding:20px 0 18px;gap:26px}
      .top{padding:0 4px}
      .tag{display:none}
      h1{font-size:clamp(47px,15vw,72px);line-height:.92}
      .choices{grid-template-columns:1fr;gap:12px}
      .choice{min-height:190px;padding:22px;border-radius:22px}
      .choice h2{font-size:36px}
      .choice p{font-size:12px}
      .foot{padding:0 4px;font-size:9px}
      .orb{width:110vw;top:43%}
    }
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{transition:none!important;animation:none!important}
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="noise" aria-hidden="true"></div>
    <div class="orb" id="orb" aria-hidden="true"></div>

    <div class="shell">
      <div class="top">
        <div class="brand">Pato Creando</div>
        <div class="tag">AI Content · Web Design</div>
      </div>

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">¿Qué querés <span class="accent">crear?</span></h1>

        <div class="choices">
          <a class="choice" href="https://patocreando.github.io/portfolio/" aria-label="Ver portfolio de contenido con IA">
            <div class="eyebrow">01 / Contenido</div>
            <div>
              <h2>Contenido con IA</h2>
              <p>UGC · Ads · Product Videos</p>
            </div>
          </a>

          <a class="choice" href="https://patocreando.github.io/web/" aria-label="Ver servicio de diseño web">
            <div class="eyebrow">02 / Web</div>
            <div>
              <h2>Diseño Web</h2>
              <p>Landing · Web · Conversión</p>
            </div>
          </a>
        </div>
      </section>

      <div class="foot">
        <span class="dot">Disponible para proyectos</span>
        <span>Elegí un camino</span>
      </div>
    </div>
  </main>

  <script>
    const page=document.getElementById('page');
    const orb=document.getElementById('orb');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduce){
      addEventListener('pointermove',e=>{
        const x=(e.clientX/innerWidth)*100;
        const y=(e.clientY/innerHeight)*100;
        page.style.setProperty('--mx',x+'%');
        page.style.setProperty('--my',y+'%');
        const dx=(e.clientX/innerWidth-.5)*18;
        const dy=(e.clientY/innerHeight-.5)*18;
        orb.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
      },{passive:true});
    }
  </script>
</body>
</html>
